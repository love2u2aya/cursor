<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Git セーブポイント練習</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=IBM+Plex+Sans+JP:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c2b24;
      --moss: #2f6b4f;
      --leaf: #7cb518;
      --sand: #e8f0e4;
      --sky: #d7ebe3;
      --card: rgba(255, 255, 255, 0.72);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "IBM Plex Sans JP", sans-serif;
      background:
        radial-gradient(circle at 12% 18%, #c8e6c0 0%, transparent 42%),
        radial-gradient(circle at 88% 12%, #9fd4c4 0%, transparent 38%),
        linear-gradient(160deg, #f3faf5 0%, #dcefe6 45%, #c5ddd2 100%);
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    h1 {
      font-family: "Zen Maru Gothic", sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      margin: 0 0 0.5rem;
      letter-spacing: 0.02em;
    }

    .lead {
      margin: 0 0 2rem;
      line-height: 1.7;
      opacity: 0.9;
    }

    .timeline {
      display: grid;
      gap: 1rem;
      position: relative;
      padding-left: 1.2rem;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 0.35rem;
      top: 0.4rem;
      bottom: 0.4rem;
      width: 3px;
      border-radius: 999px;
      background: linear-gradient(var(--moss), var(--leaf));
    }

    .save {
      position: relative;
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(47, 107, 79, 0.18);
      border-radius: 16px;
      padding: 1rem 1.1rem 1.1rem 1.2rem;
      animation: rise 0.6s ease both;
    }

    .save:nth-child(2) { animation-delay: 0.12s; }
    .save:nth-child(3) { animation-delay: 0.24s; }

    .save::before {
      content: "";
      position: absolute;
      left: -1.05rem;
      top: 1.15rem;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--leaf);
      box-shadow: 0 0 0 4px rgba(124, 181, 24, 0.25);
    }

    .save h2 {
      font-family: "Zen Maru Gothic", sans-serif;
      font-size: 1.15rem;
      margin: 0 0 0.35rem;
      color: var(--moss);
    }

    .save p {
      margin: 0.25rem 0;
      line-height: 1.6;
    }

    .tag {
      display: inline-block;
      margin-top: 0.55rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--moss);
      background: var(--sky);
      padding: 0.2rem 0.55rem;
      border-radius: 8px;
    }

    .hint {
      margin-top: 2rem;
      padding: 1rem 1.1rem;
      border-left: 4px solid var(--moss);
      background: rgba(255, 255, 255, 0.55);
      border-radius: 0 12px 12px 0;
      line-height: 1.7;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <h1>Git セーブポイント練習</h1>
    <p class="lead">
      下のカードは、ゲームのセーブと同じイメージです。<br />
      Git では、それぞれのセーブを <strong>commit</strong> と呼びます。
    </p>

    <section class="timeline" aria-label="セーブポイント一覧">
      <article class="save">
        <h2>セーブ 1</h2>
        <p>ファイルを作った</p>
        <span class="tag">最初の commit</span>
      </article>
      <article class="save">
        <h2>セーブ 2</h2>
        <p>文章を足した（前のセーブは消えない）</p>
        <span class="tag">2つ目の commit</span>
      </article>
      <article class="save">
        <h2>セーブ 3</h2>
        <p>このページ（見た目）を追加した</p>
        <span class="tag">いま見ている commit</span>
      </article>
    </section>

    <p class="hint">
      次は <code>HANDS_ON.md</code> を開いて、自分の Mac（On This Mac）でも同じ流れを試してみましょう。
    </p>
  </main>
</body>
</html>
